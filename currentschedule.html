<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SU Planner Admin – Current schedule</title>
  <meta name="description" content="SU's Fall timetable as it is now, room by room, to compare with the model's new schedule.">
  <link rel="stylesheet" href="css/admin.css?v=202611161908">
  <link rel="stylesheet" href="css/bigrooms.css?v=202611161908">
  <link rel="stylesheet" href="css/newschedule.css?v=202611161908">
</head>
<body data-mode="current">
  <header class="topbar">
    <h1 class="brand"><a href="bigrooms.html">SU<span class="bp"> Planner</span> <small>Admin</small></a></h1>
    <nav class="page-tabs" aria-label="Pages">
      <a href="bigrooms.html"><span class="long">Big rooms</span><span class="short">Big rooms</span></a>
      <a href="currentschedule.html" aria-current="page"><span class="long">Current schedule</span><span class="short">Current</span></a>
      <a href="newschedule.html"><span class="long">New schedule</span><span class="short">New</span></a>
      <a href="others.html"><span class="long">Others</span><span class="short">Others</span></a>
    </nav>
    <a class="student-link" href="https://atamolla.github.io/su-planner/">Student site ↗</a>
  </header>

  <main>
    <section class="page-head">
      <h2>Current schedule</h2>
      <p>SU's Fall timetable as it is now: every class by day and hour (or room by room). Same layout as the
        New schedule tab, so you can switch between the two tabs and compare.</p>
    </section>

    <div id="tiles" class="tiles"></div>

    <div class="controls">
      <div id="view" class="seg" role="group" aria-label="View"></div>
      <div id="only" class="seg" role="group" aria-label="Which classes"></div>
      <select id="bld" aria-label="Building"></select>
      <select id="subj" aria-label="Subject"></select>
      <input id="q" type="search" placeholder="Find a course, e.g. CS 303" aria-label="Find a course">
    </div>
    <div class="controls ns-filters">
      <div id="years" class="years" role="group" aria-label="Show or hide course years"></div>
      <select id="prog" aria-label="Program"></select>
      <select id="entry" aria-label="Curriculum of entry year"></select>
      <div id="cats" class="seg" role="group" aria-label="Program course types"></div>
      <div id="season" class="seg" role="group" aria-label="Suggested plan semesters"></div>
    </div>
    <div class="legend-row ns-legend" id="legend"></div>

    <div id="out"></div>

    <p class="note" id="foot"></p>
  </main>

  <script src="data/courses.js?v=202611161908"></script>

  <script src="js/newschedule.js?v=202611161908"></script>
</body>
</html>
